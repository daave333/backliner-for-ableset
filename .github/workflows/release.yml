# Baut die Mac-App und veröffentlicht sie als GitHub-Release.
# Auslösen: ein Tag wie v1.6.0 pushen (oder unter "Actions" → "Release" → "Run workflow" mit Versionsnummer).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 1.6.1'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15-intel   # Intel-Server: weniger ausgelastet, die App wird trotzdem universal (Intel + Apple-Chip)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version festlegen
        id: v
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Pakete installieren
        run: npm ci

      - name: App bauen (DMG + ZIP, Intel und Apple Silicon)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Backliner for AbleSet ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
